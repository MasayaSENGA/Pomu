name: card_usage_tracker
description: 保有クレジットカードの毎月の利用（$付け）を管理するアプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  # 18.x / 19.x のどちらでも本アプリのコードはコンパイル可能。
  # pub が SDK に合う最新版を選べるように範囲指定にしている。
  flutter_local_notifications: '>=18.0.1 <20.0.0'
  timezone: '>=0.9.4 <0.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
